[build]
  functions = "functions"
  publish = "public"

[functions]
  directory = "functions"

[functions."*"]
  node_bundler = "esbuild"
  external_node_modules = [
    "pg",
    "bcryptjs",
    "firebase-admin",
    "nodemailer",
    "qrcode",
    "speakeasy"
  ]

[functions."purge_expired_temporary_data"]
  schedule = "@hourly"

[functions."monitor_temporary_data_cleanup"]
  schedule = "17 */3 * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# 🔥 ADD THIS
[[redirects]]
  from = "/qr/*"
  to = "/.netlify/functions/qr"
  status = 200
